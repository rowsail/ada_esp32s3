name: CI

# Everything that can be checked without a board.
#
# Before this existed, the only workflow in this repo built the book PDF, and
# nothing compiled the code.  Two regressions survived in the tree as a result:
# examples/esp32s3_lcd stopped compiling when LCD.RGB_Pins gained a component
# (136 commits, ~6 weeks), and the HAL would not build under light-tasking --
# its OWN default profile -- because the exclusion list it used at the time had
# drifted.  Neither could reach a release now: the job below builds the
# libraries on every profile they support, builds all 96 examples, and runs the
# host suites, and it is the same `./x test` a contributor runs locally.
#
# The analyze job runs the three adalang_analyzer gates against the committed
# baselines in tools/analyzer-baselines/, so a NEW finding fails the PR that
# introduces it rather than waiting for someone to run it locally.
#
# Not covered here, and deliberately: anything needing real silicon (the driver
# self-tests, the ACATS sweep).  Those stay on the bench.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + host tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The cross GNAT, the native GNAT and gprbuild.  Alire is only a package
      # manager here: nothing in the build calls `alr` (see tools/sdk-env.sh),
      # it just puts the toolchains where ESP32S3_ADA_TOOLCHAINS looks.
      # Versions are pinned to the known-good pair recorded in tools/sdk-env.sh
      # -- sdk-env prints a note when they drift, and CI should not drift
      # silently under the tree it is validating.
      - name: Install Alire
        uses: alire-project/setup-alire@v4
        with:
          version: 2.1.0

      - name: Install the toolchains
        # `--select` is the only way to get a toolchain onto disk: alr 2.1.0 has
        # no --install ("Unrecognized option"), and its --select both downloads
        # and marks a default.
        #
        # WHICH ONE IS "DEFAULT" DOES NOT MATTER HERE, and that is the point of
        # three separate calls.  Nothing in this repo invokes `alr` --
        # tools/sdk-env.sh globs $ESP32S3_ADA_TOOLCHAINS (Alire's install dir by
        # default) and takes the newest match, so the toolchains only need to
        # EXIST.  Alire keeps every downloaded toolchain and marks the unselected
        # ones "Available", so selecting the cross GNAT and then the native one
        # leaves both on disk; only the label moves.  Verified against alr 2.1.0.
        #
        # -n so a prompt can never hang the runner.  Versions are the known-good
        # set recorded in tools/sdk-env.sh -- bump them together.
        run: |
          alr -n toolchain --select gprbuild=26.0.1
          alr -n toolchain --select gnat_xtensa_esp32_elf=15.2.1
          alr -n toolchain --select gnat_native=15.2.1
          alr toolchain
          ls -1 "$HOME/.local/share/alire/toolchains"

      # xtensa-dynconfig is built from source by tools/sdk-env.sh on first use;
      # it needs a host C toolchain and, on a cold cache, network access to
      # fetch its upstream.  Cache the built plugin: it changes only when the
      # pinned overlay does.
      - name: Cache the xtensa-dynconfig plugin
        uses: actions/cache@v4
        with:
          path: crates/xtensa-dynconfig/xtensa-dynconfig
          key: dynconfig-${{ runner.os }}-${{ hashFiles('crates/xtensa-dynconfig/**/*.c', 'crates/xtensa-dynconfig/scripts/setup.sh') }}

      - name: Python (the FTP and DNS host suites drive a local server)
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # e2fsprogs/dosfstools: mkfs_host and fat16_host cross-check the images
      # this repo's pure-Ada filesystems write against the host's own fsck.
      - name: Filesystem cross-check tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs dosfstools

      # chain_host's certificates are generated and signed for each run rather
      # than committed, so the fixture is only ever as wrong as the case it is
      # named for.
      - name: Certificate fixtures
        run: pip install cryptography

      # The whole gate.  Libraries on every profile they support (warnings are
      # failures), then all 96 examples, then the host suites.
      - name: ./x test
        run: ./x test

  prove:
    name: SPARK proofs
    runs-on: ubuntu-latest
    # p256 alone is ~2.5 minutes and the TLS walk runs at level 2; the whole
    # sweep is well inside this, with room for a slower runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Alire
        uses: alire-project/setup-alire@v4
        with:
          version: 2.1.0

      # The native compiler (the prove projects are all native -- run-time-error
      # freedom of pure logic is target-independent) and gprbuild to load them.
      - name: Install the toolchains
        run: |
          alr -n toolchain --select gprbuild=26.0.1
          alr -n toolchain --select gnat_native=15.2.1

      # gnatprove is a crate, not a toolchain: `alr install` puts it in
      # ~/.alire/bin, which is where prove.sh looks.
      - name: Install GNATprove
        run: |
          alr -n install gnatprove
          "$HOME/.alire/bin/gnatprove" --version

      # Exits non-zero if any project reports an unproved obligation, and prints
      # the Run-time Checks / Assertions / Functional Contracts rows for each so
      # a drop in coverage is visible in the log even when nothing fails.
      - name: book/prove/prove.sh
        run: ./book/prove/prove.sh

  analyze:
    name: static analysis
    runs-on: ubuntu-latest
    # A cold run BUILDS libadalang from source (a 601 MB build tree); a warm one
    # restores a 137 MB binary from the cache and skips straight to analysing.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Alire
        uses: alire-project/setup-alire@v4
        with:
          version: 2.1.0

      # Same three toolchains, and for the same reason, as the test job: nothing
      # here calls `alr` to build, but loading a cross project needs the xtensa
      # compiler discoverable, and the analyzer links against the native GNAT's
      # libgnarl at run time.
      - name: Install the toolchains
        run: |
          alr -n toolchain --select gprbuild=26.0.1
          alr -n toolchain --select gnat_xtensa_esp32_elf=15.2.1
          alr -n toolchain --select gnat_native=15.2.1

      - name: Cache the xtensa-dynconfig plugin
        uses: actions/cache@v4
        with:
          path: crates/xtensa-dynconfig/xtensa-dynconfig
          key: dynconfig-${{ runner.os }}-${{ hashFiles('crates/xtensa-dynconfig/**/*.c', 'crates/xtensa-dynconfig/scripts/setup.sh') }}

      # Cache the BINARY, not the build tree.  adalang_analyzer links libadalang
      # statically -- the installed executable is 137 MB and its only dynamic
      # dependency outside libc is libgnarl from the native GNAT above, so it
      # runs on its own.  Caching ~/.alire/bin instead of the 1.8 GB of Alire
      # build output turns a 20-40 minute rebuild into a restore.
      - name: Cache adalang_analyzer
        id: cache-analyzer
        uses: actions/cache@v4
        with:
          path: ~/.alire/bin/adalang_analyzer
          key: adalang-analyzer-${{ runner.os }}-1.3.0

      - name: Install adalang_analyzer
        if: steps.cache-analyzer.outputs.cache-hit != 'true'
        run: alr -n install adalang_analyzer

      # Two gates, two baselines.  Each reports only findings that are NOT
      # already in tools/analyzer-baselines/ and exits non-zero when one appears.
      # They are separate steps so the log says which view regressed.
      - name: ./x analyze (defects)
        run: |
          export PATH="$HOME/.alire/bin:$PATH"
          ./x analyze

      - name: ./x analyze --style (readability)
        run: |
          export PATH="$HOME/.alire/bin:$PATH"
          ./x analyze --style

  book:
    name: book builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The release workflow (book.yml) publishes the PDF on a tag; this only
      # proves the LaTeX still compiles, so a broken \ref or a renamed chapter
      # fails on the pull request rather than on the tag.
      - name: Build the book PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: book
          root_file: main.tex

  docs:
    name: guide samples compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: alire-project/setup-alire@v4
        with:
          version: 2.1.0
      - name: Install the toolchains
        # `--select` is the only way to get a toolchain onto disk: alr 2.1.0 has
        # no --install ("Unrecognized option"), and its --select both downloads
        # and marks a default.
        #
        # WHICH ONE IS "DEFAULT" DOES NOT MATTER HERE, and that is the point of
        # three separate calls.  Nothing in this repo invokes `alr` --
        # tools/sdk-env.sh globs $ESP32S3_ADA_TOOLCHAINS (Alire's install dir by
        # default) and takes the newest match, so the toolchains only need to
        # EXIST.  Alire keeps every downloaded toolchain and marks the unselected
        # ones "Available", so selecting the cross GNAT and then the native one
        # leaves both on disk; only the label moves.  Verified against alr 2.1.0.
        #
        # -n so a prompt can never hang the runner.  Versions are the known-good
        # set recorded in tools/sdk-env.sh -- bump them together.
        run: |
          alr -n toolchain --select gprbuild=26.0.1
          alr -n toolchain --select gnat_xtensa_esp32_elf=15.2.1
          alr -n toolchain --select gnat_native=15.2.1
          alr toolchain
          ls -1 "$HOME/.local/share/alire/toolchains"
      - name: Cache the xtensa-dynconfig plugin
        uses: actions/cache@v4
        with:
          path: crates/xtensa-dynconfig/xtensa-dynconfig
          key: dynconfig-${{ runner.os }}-${{ hashFiles('crates/xtensa-dynconfig/**/*.c', 'crates/xtensa-dynconfig/scripts/setup.sh') }}
      # check_samples.sh compiles the guide's samples against the EMBEDDED
      # runtime, which is generated rather than committed -- and gpio0_blink is
      # a light-tasking example, so building it produced the wrong one and the
      # check bailed with "no embedded runtime at ...".  i2c_loopback is the
      # example its own error message suggests.
      - name: Build an embedded example (generates the embedded runtime)
        run: ./x build i2c_loopback
      - name: Check the guide
        run: ./docs/check_samples.sh
      # Cross-compile check for the Wi-Fi ABI rep clauses (host word size cannot
      # validate them).  This was broken -- it never had svd/ on its search
      # path, so it could not compile anything -- and nothing noticed.
      - name: Wi-Fi ABI cross-check
        run: ./libs/esp32s3_wifi/test/cross_check.sh
